# Esquema de etiquetas (TP Semana 1, + dod/bloqueado-c7 en Semana 2). 4 ejes ortogonales, 25 etiquetas.
# Se crean con scripts/fase2-github.ps1 (gh label create --force). Antes se borran las etiquetas por defecto de GitHub.
- {name: "tipo/bug",                 color: "d73a4a", description: "Un usuario percibe hoy un comportamiento incorrecto"}
- {name: "tipo/technical-debt",      color: "fbca04", description: "Funciona, pero cada cambio cuesta mas de lo necesario"}
- {name: "tipo/feature",             color: "0e8a16", description: "Capacidad nueva para usuarios o para el equipo"}
- {name: "tipo/documentation",       color: "0075ca", description: "Documentacion, ADR, guias"}
- {name: "dod/pendiente",            color: "c5def5", description: "Aun no se evaluo contra la DoD"}
